name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端 单测 & 启动冒烟
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      - name: 语法检查
        run: python -m compileall app

      - name: 模块导入检查
        run: python -c "from app.main import app; assert app.title"

      - name: Python 3.9 类型注解与工具 schema 检查
        run: python -c "from app.agent.analysis_plan import AnalysisPlan; from app.tools.statistical_tool import make_statistical_tools; AnalysisPlan(goal='兼容性检查').model_json_schema(); assert len(make_statistical_tools()) == 5"

      - name: pytest 单测（核心逻辑）
        run: python -m pytest tests/

      - name: 启动冒烟测试（/api/health）
        run: |
          (python app/main.py > /tmp/backend.log 2>&1 &) && \
          for i in $(seq 1 20); do \
            curl -sf http://localhost:8000/api/health && exit 0; \
            sleep 2; \
          done; \
          echo "--- 后端日志 ---"; cat /tmp/backend.log; exit 1

  frontend:
    name: 前端 单测 & 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: vitest 基础测试
        run: npm test

      - name: 生产构建
        run: npm run build
