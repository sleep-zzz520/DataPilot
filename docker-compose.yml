# 一键启动：docker compose up -d --build
# 访问 http://localhost:8080 （前端经 nginx 代理 /api 到后端）
services:
  backend:
    build: ./backend
    container_name: da-backend
    volumes:
      # 运行时数据（配置加密 JSON、SQLite、上传文件）持久化在宿主机
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: da-frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # 公网入口：当前先保持 HTTP，以便 Let’s Encrypt 通过 HTTP-01 验证
  # 对外 HTTPS 切换后由 Caddy 统一重定向 HTTP 并代理到 frontend。
  caddy:
    image: caddy:2.10-alpine
    container_name: da-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

  # 通过公网 IP 申请 Let’s Encrypt 短期证书；证书文件持久化在宿主机。
  certbot:
    image: certbot/certbot:v5.4.0
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    profiles:
      - certificate

volumes:
  caddy_data:
  caddy_config:
